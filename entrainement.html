<style>

:root{
  --paper:#fff;
  --surface:#f0f4f6;
  --ink:#101820;
  --ink2:#46545f;
  --ink3:#6c7a86;
  --rule:#cbd6de;
  --ok:#0b5c46;
  --ok-bg:#e6f1ec;
  --bad:#9e2b1c;
  --bad-bg:#fbeceb;
  --focus:#0b5c46;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;
  --serif:ui-serif,Georgia,"Noto Serif","Times New Roman",serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --r:3px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);

}
button{font:inherit;color:inherit;cursor:pointer;border-radius:var(--r)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- barre supérieure ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right));
  min-height:56px;
}
.topbar .brand{
  display:inline-block;color:var(--ink);font-weight:650;letter-spacing:-.01em;
  font-size:.98rem;line-height:1.2;text-decoration:none;cursor:pointer;
  transition:opacity .12s;
}
.topbar .brand:hover{opacity:.85}
.topbar .brand .name{display:block}
/* bloc de gauche : logo, drapeau, nom de l'examen */
.topbar .brandgroup{display:flex;align-items:center;gap:8px;min-width:0}
.topbar .brandgroup small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:919px){
  .topbar{padding-left:12px;padding-right:12px;gap:8px}
  .topbar .right{gap:8px}
  .topbar .brand{font-size:.9rem}
  .topbar .brandgroup small{font-size:.7rem}
  .ghostbtn,.quitbtn{padding:6px 9px;font-size:.8rem}
  .clock{font-size:.95rem;padding:6px 8px}
}
.topbar .right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.clock{
  font:600 1.05rem/1 var(--mono);font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;padding:6px 10px;border:1px solid var(--rule);background:var(--surface);
}
.clock.low{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.flag{display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08);flex:none}
.ghostbtn{background:none;border:1px solid var(--rule);padding:8px 12px;font-size:.86rem;min-height:40px}
.ghostbtn:hover{border-color:var(--ink2)}
.gridbtn{display:none;align-items:center;justify-content:center;background:none;border:1px solid var(--rule);padding:5px 10px;font-size:.8rem;min-height:32px;line-height:1.2}
.gridbtn:hover{border-color:var(--ink2)}
.gridbtn[aria-expanded="true"]{border-color:var(--ink)}

/* ---------- coquille responsive ---------- */
.shell{
  max-width:1180px;margin:0 auto;
  display:grid;grid-template-columns:minmax(0,1fr);
  gap:0;padding-bottom:96px;
  position:relative;
}
.main{min-width:0;padding:20px max(16px,env(safe-area-inset-left)) 32px max(16px,env(safe-area-inset-right))}
.aside{display:none;min-width:0}

@media (min-width:920px){
  .shell{max-width:1180px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:44px;align-items:start}
  .aside{display:block;position:sticky;top:76px;align-self:start}
  .aside .sheet{display:block}
  .main{background:none;border:0;padding:32px 0 64px;min-height:auto;max-width:720px}
  /* largeur de lecture : ~70 caracteres max */
  .qtext,.lede,.fb,.review,.note,.verdict-line{max-width:28em}
  .mobile-only{display:none!important}
  .actionbar .btn{flex:0 0 auto;width:auto;white-space:nowrap}
}
@media (max-width:919px){
  .desktop-only{display:none!important}

/* ---------- accueil ---------- */
.eyebrow{font-size:.75rem;color:var(--ink3);letter-spacing:.02em;margin:0 0 6px}
h1{font:650 clamp(1.65rem,5.6vw,2.35rem)/1.12 var(--sans);letter-spacing:-.035em;margin:0 0 12px;max-width:22ch}
h2{font:600 1.02rem/1.3 var(--sans);letter-spacing:-.01em;margin:30px 0 12px}
.lede{color:var(--ink2);margin:0 0 4px;max-width:62ch}
.facts{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  margin:24px 0 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);
}
.fact{padding:14px 12px 14px 0;min-width:0}
.fact+.fact{border-left:1px solid var(--rule);padding-left:12px}
.fact b{display:block;font:650 clamp(1.15rem,4.6vw,1.45rem)/1.1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.fact span{font-size:.74rem;color:var(--ink3);display:block;margin-top:3px;line-height:1.3}

.list{border-top:1px solid var(--rule)}
.row{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--rule);
  padding:15px 4px;min-height:60px;border-radius:0;
}
.row:hover{background:var(--surface)}
.row .num{
  font:600 .92rem/1 var(--mono);color:var(--ink3);
  min-width:2.2em;flex-shrink:0;font-variant-numeric:tabular-nums;
}
.row .body{min-width:0;flex:1}
.row .title{font-weight:600;display:block;line-height:1.35}
.row .sub{color:var(--ink3);font-size:.82rem;display:block;margin-top:2px}
.row .best{
  font:600 .82rem/1 var(--mono);color:var(--ok);flex-shrink:0;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.row .chev{color:var(--ink3);flex-shrink:0;font-size:1.1rem}

/* ---------- question ---------- */
.qhead{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.qhead .tag{font:600 .78rem/1 var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
.qhead .theme{font-size:.78rem;color:var(--ink3)}
.qtext{
  font:400 1.28rem/1.45 var(--serif);margin:0 0 20px;
  letter-spacing:-.005em;max-width:60ch;
}
.qtext::first-letter{font-weight:600}
.opts{display:grid;gap:8px;margin:0 0 16px}
.opt{
  display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;
  width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--rule);padding:13px 14px;min-height:52px;
  font-size:1rem;line-height:1.4;transition:border-color .12s,background .12s;
}
.opt:hover{border-color:var(--ink);background:var(--surface)}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.opt .k{
  font:650 .88rem/1.55 var(--mono);width:1.55em;height:1.55em;
  display:grid;place-items:center;border:1px solid var(--rule);
  color:var(--ink2);flex-shrink:0;
}
.opt.sel{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.opt.sel .k{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}

.fb{border-left:2px solid var(--rule);padding:2px 0 2px 14px;margin:14px 0 0;font-size:.94rem;line-height:1.5;max-width:62ch}
.fb.good{border-color:var(--ok)}
.fb.bad{border-color:var(--bad)}
.fb .verdict{font-weight:650;display:block;margin-bottom:2px}
.fb.good .verdict{color:var(--ok)}
.fb.bad .verdict{color:var(--bad)}

/* ---------- grille de réponses ---------- */
.sheet h3{font:600 .78rem/1 var(--sans);color:var(--ink3);margin:0 0 12px;letter-spacing:.01em}
.sheet .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:0 0 14px}
.cell{
  aspect-ratio:1;display:grid;place-items:center;min-width:0;
  border:1px solid var(--rule);background:var(--paper);
  font:600 .82rem/1 var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums;
  padding:0;border-radius:2px;
}
.cell.done{background:var(--ink);border-color:var(--ink);color:#fff}
.cell.cur{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink);font-weight:700}
.cell.done.cur{color:#fff;box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 3px #fff}
.cell.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.cell.ko{background:var(--bad);border-color:var(--bad);color:#fff}
.cell.blank{background:var(--surface);color:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.75rem;color:var(--ink3);margin:0 0 16px}
.legend i{display:inline-block;width:10px;height:10px;border:1px solid var(--rule);margin-right:5px;vertical-align:-1px}
.legend .l-ok{background:var(--ok);border-color:var(--ok)}
.legend .l-ko{background:var(--bad);border-color:var(--bad)}
.legend .l-blank{background:var(--surface)}
.sheet .count{font-size:.86rem;color:var(--ink2);margin:0 0 4px}
.sheet .count b{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* fin d'épreuve à tout moment : simple lien-texte, jamais un bouton plein */
.endlink{
  display:inline-block;background:none;border:0;padding:6px 0;margin:2px 0 0;
  font:inherit;font-size:.8rem;line-height:1.3;color:var(--ink3);
  text-decoration:none;cursor:pointer;text-align:left;min-height:32px;
}
.endlink:hover{text-decoration:underline}
.sheet-count{margin:0 0 6px}
/* « Terminer » discret : lien-texte, jamais un bouton plein */
.finishlink{background:none;border:0;padding:8px 0;font:inherit;font-size:.8rem;color:var(--ink3);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.finishlink:hover{color:var(--ink)}

/* feuille de réponses en panneau (mobile) */
.sheet-panel{
  position:fixed;inset:auto 0 0 0;z-index:50;max-height:70vh;overflow:auto;
  background:var(--paper);border-top:1px solid var(--rule);
  box-shadow:0 -6px 24px rgba(16,24,32,.14);
  padding:14px max(16px,env(safe-area-inset-left)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right));
  transform:translateY(100%);transition:transform .2s ease;
  overscroll-behavior:contain;
}
.sheet-panel.open{transform:none}
.sheet-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.sheet-panel-head h3{font:600 .78rem/1 var(--sans);color:var(--ink3);margin:0;letter-spacing:.01em}
.sheet .grid.wrap{grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.sheet .grid.wrap .cell{min-height:40px}
.sheet-scrim{position:fixed;inset:0;z-index:45;background:rgba(16,24,32,.18)}
.sheet-scrim[hidden]{display:none}
body.sheet-open{overflow:hidden}

/* ---------- barre d'action ---------- */
.actionbar{margin-top:22px;padding:0;border:0;background:none;box-shadow:none;display:flex;justify-content:flex-end;gap:12px}
@media (max-width:919px){
  .actionbar{position:sticky;bottom:0;z-index:25;background:var(--paper);border-top:1px solid var(--rule);padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-top:22px}
  .actionbar .btn{flex:1}
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--ink);color:#fff;border:1px solid var(--ink);
  padding:13px 20px;font-weight:600;font-size:.95rem;min-height:48px;
}
.btn:hover{background:#000}
.btn[disabled]{background:var(--rule);border-color:var(--rule);color:#fff;cursor:not-allowed}
.btn.ghost[disabled]{background:var(--paper);border-color:var(--rule);color:var(--ink3);opacity:.55;cursor:not-allowed}
.btn.ghost[disabled]:hover{background:var(--paper);border-color:var(--rule)}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink);background:var(--surface)}

/* ---------- résultat ---------- */
.score{font:700 3.2rem/1 var(--sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:0}
.score.pass{color:var(--ok)}
.score.fail{color:var(--bad)}
.verdict-line{color:var(--ink2);margin:8px 0 0;max-width:56ch}
.threshold{height:3px;background:var(--surface);margin:20px 0 0;position:relative;max-width:520px}
.threshold .fill{height:100%;background:var(--ink2)}
.threshold .mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--bad);left:80%}
.threshold .lbl{position:absolute;top:8px;left:80%;transform:translateX(-50%);font:600 .72rem/1 var(--mono);color:var(--bad);white-space:nowrap;margin-top:2px}

details{border-top:1px solid var(--rule);padding:12px 0}
details summary{cursor:pointer;font-weight:600;font-size:.94rem;padding:4px 0;min-height:32px}
details[open] summary{margin-bottom:8px}
.review{border-left:2px solid var(--rule);padding-left:14px;margin:0 0 16px;max-width:64ch}
.review .rq{font:400 1rem/1.4 var(--serif);margin:4px 0 8px}
.review .rl{font-size:.88rem;margin:2px 0}
.review .rl.no{color:var(--bad)}
.review .rl.yes{color:var(--ok);font-weight:600}
.review .rx{font-size:.86rem;color:var(--ink2);margin-top:6px}

.note{font-size:.82rem;color:var(--ink3);margin:18px 0 0;max-width:62ch}
.cta-band{border:1px solid var(--rule);padding:16px;margin:26px 0 0;background:var(--surface)}
.cta-band p{margin:0 0 10px;font-size:.92rem;color:var(--ink2)}
.hidden{display:none}

/* ---------- reprise d'un examen ---------- */
.resume{
  display:flex;align-items:center;gap:12px 14px;flex-wrap:wrap;
  border:1px solid var(--ink);border-left:3px solid var(--ink);
  background:var(--surface);padding:12px 14px;margin:0 0 12px;
}
.resume p{margin:0;flex:1 1 220px;font-size:.92rem;line-height:1.4;min-width:0}
.resume .btn{min-height:40px;padding:8px 16px;font-size:.88rem}

/* ---------- bouton Quitter de la barre ---------- */
.quitbtn{padding:5px 10px;font-size:.8rem;min-height:32px;line-height:1.2}

/* ---------- panneau de confirmation ---------- */
.dialog{
  position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
  background:rgba(16,24,32,.42);
}
.dialog-panel{
  background:var(--paper);color:var(--ink);
  flex:0 1 420px;max-height:100%;overflow:auto;
  border:1px solid var(--ink);border-radius:var(--r);padding:22px 22px 18px;
  box-shadow:0 12px 40px rgba(16,24,32,.22);
}
.dialog-panel h2{font:650 1.15rem/1.25 var(--sans);letter-spacing:-.015em;margin:0 0 8px}
.dialog-panel p{margin:0 0 18px;color:var(--ink2);font-size:.94rem;line-height:1.5}
.dialog-actions{display:flex;flex-direction:column-reverse;gap:8px}
.dialog-actions .btn{width:100%}
</style>

s les principes républicains peut être dissoute par l’État."},{"id":"1-23","theme":1,"question":"Une personne peut-elle changer librement de religion en France ?","answer":"Oui, librement","wrong":["Non, c’est interdit","Oui, avec l’accord du maire","Oui, mais une seule fois dans sa vie"],"explication":"La laïcité garantit la liberté de conscience : avoir une religion, en changer ou ne plus en avoir."},{"id":"1-26","theme":1,"question":"En France, il est possible pour l’État de financer :","answer":"La restauration d’un monument religieux classé","wrong":["Les cérémonies d’une religion particulière","L’achat d’objets de culte pour une église","La promotion d’une religion dans les écoles"],"explication":"Mais pas la construction d’un lieu de culte ni le salaire d’un religieux (exceptions en Alsace et en Moselle)."},{"id":"1-28","theme":1,"question":"Que dit la loi de 1905 ?","answer":"Les Églises et l’État sont séparés","wrong":["Le catholicisme est la religion de l’État","Les religions sont interdites dans la rue","L’État paie les responsables religieux"],"explication":"La République garantit la liberté de conscience et le libre exercice des cultes, mais ne reconnaît, ne salarie ni ne subventionne aucun culte."},{"id":"1-30","theme":1,"question":"Quel jour célèbre-t-on officiellement la laïcité en France ?","answer":"Le 9 décembre","wrong":["Le 14 juillet","Le 1er mai","Le 11 novembre"],"explication":"Date de la loi de 1905."},{"id":"1-34","theme":1,"question":"Quelle institution française doit rester neutre en matière de religion ?","answer":"L’école publique","wrong":["Une association religieuse","Une entreprise privée","Un parti politique"],"explication":""},{"id":"2-13","theme":2,"question":"En France, est-ce obligatoire de voter ?","answer":"Non, mais c’est un devoir civique","wrong":["Oui, sinon on paie une amende","Oui, après 30 ans","Non, c’est réservé aux hommes"],"explication":""},{"id":"2-16","theme":2,"question":"Qui vote les lois ?","answer":"Le Parlement","wrong":["Le Président seul","Le préfet","Le Conseil constitutionnel"],"explication":""},{"id":"2-24","theme":2,"question":"Qui dirige l’action du gouvernement ?","answer":"Le Premier ministre","wrong":["Le président du Sénat","Le président de l’Assemblée nationale","Le Conseil d’État"],"explication":""},{"id":"2-32","theme":2,"question":"Qui assure l’intérim du président de la République en cas de décès ?","answer":"Le président du Sénat","wrong":["Le Premier ministre","Le président de l’Assemblée nationale","Le ministre de l’Intérieur"],"explication":"Jusqu’à l’élection organisée en urgence (cas de Georges Pompidou, mort en 1974)."},{"id":"2-43","theme":2,"question":"Qui a composé l’hymne de l’Union européenne ?","answer":"Ludwig van Beethoven","wrong":["Wolfgang Amadeus Mozart","Claude Debussy","Giuseppe Verdi"],"explication":"L’Ode à la joie, extrait de sa Neuvième symphonie."},{"id":"2-44","theme":2,"question":"Quand est célébrée la journée de l’Europe ?","answer":"Le 9 mai","wrong":["Le 14 juillet","Le 1er janvier","Le 11 novembre"],"explication":"En souvenir de la déclaration de Robert Schuman du 9 mai 1950."},{"id":"3-3","theme":3,"question":"Laquelle de ces citations est inscrite dans la Déclaration des Droits de l’Homme et du Citoyen de 1789 ?","answer":"« Les hommes naissent et demeurent libres et égaux en droits »","wrong":["« Tous les citoyens doivent pratiquer une religion »","« Le roi est la source de toute souveraineté »","« Le travail, la famille et la patrie sont sacrés »"],"explication":"Article 1er. Autre citation : « La liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui » (article 4)."},{"id":"3-5","theme":3,"question":"Que dit l’article 1er de la Constitution française ?","answer":"La France est une République indivisible, laïque, démocratique et sociale","wrong":["La France est une monarchie constitutionnelle et parlementaire","Le catholicisme est la religion officielle de la France","La France est un État fédéral composé de toyen s’il est appelé à être juré dans un procès d’assises ?","answer":"Se présenter et participer au procès","wrong":["Refuser sans justification","Envoyer un proche à sa place","Choisir le procès qui l’intéresse"],"explication":"Seul un motif grave permet d’être dispensé. Un refus sans motif est puni d’une amende pouvant aller jusqu’à 3 750 €."},{"id":"3-32","theme":3,"question":"Quel est l’un des devoirs principaux d’un citoyen français ?","answer":"Respecter les lois","wrong":["Adhérer à un parti","Pratiquer une religion","Posséder un logement"],"explication":"Aussi : payer ses impôts, participer à la défense nationale, être juré si tiré au sort, voter (devoir civique)."},{"id":"3-36","theme":3,"question":"Qui peut être appelé à faire partie d’un jury d’assises en France ?","answer":"Les citoyens français tirés au sort","wrong":["Les avocats volontaires","Les policiers","Les étrangers résidant en France"],"explication":""},{"id":"4-3","theme":4,"question":"Quel est l’objectif des lois scolaires de la IIIe République ?","answer":"Rendre l’école gratuite, laïque et obligatoire","wrong":["Créer les premières universités françaises","Rendre l’école payante pour toutes les familles","Imposer l’enseignement religieux à l’école"],"explication":"Lois de Jules Ferry."},{"id":"4-14","theme":4,"question":"De quand date l’appel à la résistance du général de Gaulle ?","answer":"Du 18 juin 1940","wrong":["Du 14 juillet 1789","Du 8 mai 1945","Du 11 novembre 1918"],"explication":""},{"id":"4-23","theme":4,"question":"Que célèbre-t-on le 8 mai ?","answer":"La fin de la Seconde Guerre mondiale en Europe","wrong":["La prise de la Bastille en 1789","La fête du Travail et des travailleurs","L’armistice de la Première Guerre mondiale"],"explication":""},{"id":"4-26","theme":4,"question":"Le 11 novembre est un jour férié. À quoi correspond cette date ?","answer":"L’armistice de 1918","wrong":["La fin de la Seconde Guerre mondiale","La fête nationale","La prise de la Bastille"],"explication":"Hommage à tous les morts pour la France."},{"id":"4-28","theme":4,"question":"Qui a aboli l’esclavage en France ?","answer":"Victor Schœlcher","wrong":["Napoléon Ier","Louis XIV","Jules Ferry"],"explication":""},{"id":"4-60","theme":4,"question":"Quel musée est situé à Paris ?","answer":"Le musée du Louvre","wrong":["Le musée du Prado","Le British Museum","Le Rijksmuseum"],"explication":""},{"id":"4-69","theme":4,"question":"Quelle mer ou océan borde la France métropolitaine ?","answer":"L’océan Atlantique","wrong":["L’océan Pacifique","La mer Baltique","La mer Noire"],"explication":""},{"id":"4-70","theme":4,"question":"Quelle mer se situe entre la France et l’Angleterre ?","answer":"La Manche","wrong":["La mer Méditerranée","La mer Baltique","La mer Noire"],"explication":""},{"id":"5-6","theme":5,"question":"Dans quel cas faut-il déclarer son enfant au service d’état civil ?","answer":"À sa naissance","wrong":["À son entrée à l’école","À ses 18 ans","À son premier anniversaire"],"explication":"Les mariages et les décès doivent aussi être déclarés."},{"id":"5-11","theme":5,"question":"En cas de divorce, qui exerce l’autorité parentale ?","answer":"Les deux parents","wrong":["La mère uniquement","Le père uniquement","Les grands-parents"],"explication":""},{"id":"5-17","theme":5,"question":"À quoi sert la carte Vitale ?","answer":"À prouver ses droits à l’Assurance maladie","wrong":["À voter aux élections","À voyager en train à prix réduit","À ouvrir un compte bancaire"],"explication":""},{"id":"5-19","theme":5,"question":"Qu’est-ce que le tiers payant ?","answer":"Ne pas avancer la part remboursée","wrong":["Payer deux fois la consultation","Faire payer quelqu’un d’autre","Être soigné sans papiers d’identité"],"explication":""}],"exams":[["1-28","1-7","1-26","1-23","1-5","1-30","1-11","1-18","1-14","1-34","1-8","2-43","2-16","2-24","2-44","2-32","2-13","3-24","3-15","3-30","3-12","3-3","3-32","3-5","3-36","3-23","3-29","3-14","4-26","4-3","4-69","4-60","4-28","4-70","4-23","4-14","5-17","5-11","5-19","5-6"]]};
const $ = s => document.querySelector(s);
const LS = "embrun_quiz_v2";
const state = JSON.parse(localStorage.getItem(LS) || '{"best":{},"done":{}}');
if (!state.best || typeof state.best !== "object") state.best = {};
if (!state.done || typeof state.done !== "object") state.done = {};
if (!state.exam || typeof state.exam !== "object") state.exam = null;
const save = () => { try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){} };
const byId = Object.fromEntries(DATA.questions.map(q => [q.id, q]));
const THEMES = Object.fromEntries(DATA.themes.map(t => [t.n, t.title]));
const LETTERS = ["A","B","C","D"];
const isPublic = !!DATA.public;

const shuffle = (a, seed) => {
  let x = seed | 0 || 1;
  const r = () => (x = (x * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};
const seedOf = q => [...q.id].reduce((s, c) => s + c.charCodeAt(0), 7);
const optsOf = q => shuffle([...q.wrong, q.answer], seedOf(q));

// left : sous-titre du logo (nom de l'examen, thème...) ; right : zone droite de la barre
const setBar = (left, right) => {
  $("#examname").textContent = left || "";
  $("#topright").innerHTML = right || "";
  sheetWanted = false;   // un panneau resté ouvert référencerait un écran qui n'existe plus
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmtTime = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
const examSize = idx => DATA.exams[idx].map(id => byId[id]).filter(Boolean).length;

/* ================= SAUVEGARDE DE L'EXAMEN EN COURS ================= */
const EXAM_MARK = "examen";
let examSession = null;   // examen ouvert dans l'onglet : { idx, qs, st, quit }
let histPushed = false;   /* une seule entree d'historique ajoutee par onglet */
let examStarted = 0;      /* nombre d'épreuves lancées : garde chaque boucle propre à la sienne */
let askedOnBack = false;  /* la dernière navigation arrière a posé la confirmation de sortie */

const persistExam = () => {
  if (!examSession) return;
  const { idx, st } = examSession;
  state.exam = { idx, answers: { ...st.answers }, cur: st.cur, left: st.left, started: st.started };
  save();
};
const clearExam = () => { state.exam = null; save(); };
const resumeInfo = () => {
  const e = state.exam;
  if (!e || !Number.isFinite(e.idx) || !(e.left > 0) || !DATA.exams[e.idx]) return null;
  const total = examSize(e.idx);
  const cur = Math.min(Math.max(+e.cur || 0, 0), Math.max(total - 1, 0));
  return { e, total, cur };
};

/* ================= CONFIRMATION DE SORTIE ================= */
// opts.action : appelé sur « Quitter et garder ma progression » (gère lui-même l'historique et home()).
// opts.restoreFocus : rendre le focus au bouton qui a ouvert le panneau.
// opts.onDismiss : appelé quand le panneau se ferme avec « Continuer l'examen » (pas avec Échap).
// opts.backAfterDismiss : Échap devant le bouton retour -> on re-affiche l'épreuve au lieu de sortir.
function askQuit(opts = {}) {
  if (opts.restoreFocus === undefined) opts.restoreFocus = true;
  if (typeof opts.action !== "function") opts.action = () => { clearExam(); home(); };
  // un seul panneau à la fois ; l'ancien est détaché, donc ses touches ne sont plus retenues
  document.querySelectorAll(".dialog").forEach(d => d.remove());

  const opener = opts.restoreFocus ? document.activeElement : null;

  const dlg = document.createElement("div");
  dlg.className = "dialog";
  dlg.setAttribute("role", "dialog");
  dlg.setAttribute("aria-modal", "true");
  dlg.setAttribute("aria-labelledby", "quit-title");
  dlg.setAttribute("aria-describedby", "quit-desc");
  dlg.innerHTML = `<div class="dialog-panel">
    <h2 id="quit-title">Quitter l’examen ?</h2>
    <p id="quit-desc">Vos réponses et le temps restant sont conservés. Vous pourrez reprendre depuis l’accueil.</p>
    <div class="dialog-actions">
      <button type="button" class="btn" id="quit-stay">Continuer l’examen</button>
      <button type="button" class="btn ghost" id="quit-leave">Quitter et garder ma progression</button>
    </div>
  </div>`;

  const btns = () => [...dlg.querySelectorAll("button")];
  const stay = dlg.querySelector("#quit-stay"), leave = dlg.querySelector("#quit-leave");
  let dismissed = false;

  const live = () => !dismissed && dlg.isConnected;   // ce panneau est le panneau actif
  function onKey(e) {
    if (!live()) return;
    // le reste de la page (raccourcis 1-4, flèches...) ne répond pas sous le panneau
    e.stopImmediatePropagation();
    if (e.key === "Tab") {
      const b = btns(), i = b.indexOf(document.activeElement);
      e.preventDefault();
      b[i <= 0 ? b.length - 1 : i - 1].focus();
    } else if (e.key === "Escape") {
      e.preventDefault();   // ne ferme pas un <dialog> natif ou le plein écran
      dismissByKey();
    }
  }

  const teardown = () => {
    document.removeEventListener("keydown", onKey, true);
    if (dlg.parentNode) dlg.parentNode.removeChild(dlg);
  };
  // « Continuer l'examen » : on reste là où l'on est
  const dismiss = () => {
    if (dismissed) return;
    dismissed = true;
    teardown();
    // focus rendu au bouton qui a ouvert le panneau, seulement s'il existe encore : sinon on le laisse
    // là où il est ; jamais de focus sur <body>, qui peut déclencher un défilement de la page
    if (opts.restoreFocus && opener && opener.isConnected) opener.focus();
    if (typeof opts.onDismiss === "function") opts.onDismiss();
  };
  // Échap devant le bouton retour : l'entrée « examen » a été consommée. On réaffiche l'accueil,
  // puis on pousse une nouvelle entrée avant de remettre l'épreuve : jamais history.back() ici
  // (l'accueil est déjà l'entrée courante, on sortirait de la page).
  const dismissByKey = () => {
    if (dismissed || !dlg.isConnected) return;   // panneau déjà remplacé par un autre écran : Échap ne fait plus rien
    dismissed = true;
    teardown();
    if (!opts.backAfterDismiss) return;
    const info = resumeInfo();
    histPushed = false;
    home({ noHistory: true, silent: true });
    if (info) {
      PUSH();
      histPushed = true;
      startExam(info.e.idx, true, true);
    }
  };

  stay.onclick = dismiss;
  leave.onclick = () => { teardown(); opts.action(); };
  // clic sur le fond : rien ne se passe (pas de déplacement de focus : le parcours documentaire
  // d'un clic hors panneau peut faire perdre l'événement suivant dans certains navigateurs)
  dlg.addEventListener("click", ev => { if (ev.target === dlg) ev.preventDefault(); });
  document.addEventListener("keydown", onKey, true);

  document.body.appendChild(dlg);
  stay.focus();
}

// ================= FEUILLE DE RÉPONSES (panneau mobile « Grille ») ================= */
const sheetEl = () => document.getElementById("sheet");
const scrimEl = () => document.querySelector(".sheet-scrim:not([hidden])");
let sheetWanted = false;   // état voulu, indépendant de la classe posée sur le panneau
// ouvert = l'état voulu. Relire l'écran (classe, visibility) empêchait la réouverture : la
// fermeture marquait le panneau « hidden » et le re-rendu rétablissait ce masquage.
const sheetIsOpen = () => sheetWanted;
// seul point qui applique l'état voulu au panneau, au voile, au défilement et à l'état ARIA :
// à l'ouverture, à la fermeture, et à chaque re-rendu (réponse, clic sur une case) qui recrée #app.
function syncSheet(focusFirst) {
  const panel = document.getElementById("sheet-panel");
  const scrim = document.querySelector(".sheet-scrim");
  const g = document.getElementById("gridbtn");
  if (sheetWanted && !panel) sheetWanted = false;   // plus d'épreuve sous le panneau
  if (sheetWanted && document.querySelector(".dialog")) sheetWanted = false;   // la confirmation prend le premier plan
  const open = sheetWanted;
  if (panel) {
    panel.classList.toggle("open", open);
    panel.style.visibility = "";
  }
  if (scrim) scrim.hidden = !open;
  document.body.classList.toggle("sheet-open", open);
  if (g) g.setAttribute("aria-expanded", open ? "true" : "false");
  const b = focusFirst && panel && document.querySelector("#sheet-panel .cell");
  if (b) b.focus();
}
function openSheet(finish, total, answered) {
  // « Terminer » du panneau : confirmation existante puis finish(). Branché à chaque ouverture,
  // car le panneau est recréé à chaque re-rendu ; le bouton de la colonne de droite (data-end)
  // est branché une fois par écran dans render(), il ne doit pas être touché ici.
  const endBtn = document.querySelector("#sheet-panel [data-end]");
  if (endBtn) endBtn.onclick = () => { closeSheet(); askFinish(finish, endBtn, total - answered(), total); };
  const s = sheetEl();
  if (!s || document.querySelector(".dialog")) return;
  if (sheetIsOpen()) { syncSheet(true); return; }   // déjà ouvert : on le remet au premier plan et au focus
  const scrim = document.querySelector(".sheet-scrim");
  // « clic sur le fond » : le voile couvre l'écran, seul lui reçoit le clic
  if (scrim) scrim.onclick = () => closeSheet();
  sheetWanted = true;
  syncSheet(true);   // focus sur la première case du nouveau panneau
}

// referme le panneau (bouton Fermer, Échap, clic sur le fond)
function closeSheet() {
  sheetWanted = false;
  syncSheet();
}


// ouvre la confirmation de correction ; « Terminer » corrige (finish) comme le bouton principal
function askFinish(finish, opener, unanswered, total) {
  const dlg = document.createElement("div");
  dlg.className = "dialog";
  dlg.setAttribute("role", "dialog");
  dlg.setAttribute("aria-modal", "true");
  dlg.setAttribute("aria-labelledby", "end-title");
  dlg.setAttribute("aria-describedby", "end-desc");
  dlg.innerHTML = `<div class="dialog-panel">
    <h2 id="end-title">Terminer l’examen ?</h2>
    <p id="end-desc">L’examen sera corrigé et vous verrez votre résultat.${unanswered > 0
      ? ` Il reste ${unanswered} question${unanswered > 1 ? "s" : ""} sans réponse sur ${total}.`
      : ""}</p>
    <div class="dialog-actions">
      <button type="button" class="btn" id="end-stay">Continuer l’examen</button>
      <button type="button" class="btn ghost" id="end-go">Terminer et corriger</button>
    </div>
  </div>`;
  const btns = () => [...dlg.querySelectorAll("button")];
  let dismissed = false;
  const close = () => {
    dismissed = true;
    document.removeEventListener("keydown", onKey, true);
    dlg.remove();
    if (opener && opener.isConnected) opener.focus();
  };
  function onKey(e) {
    if (dismissed) return;
    e.stopImmediatePropagation();   // pas de raccourci 1-4 ni de flèche sous le panneau
    if (e.key === "Tab") {
      const b = btns(), i = b.indexOf(document.activeElement);
      e.preventDefault();
      b[i <= 0 ? b.length - 1 : i - 1].focus();
    } else if (e.key === "Escape") {
      e.preventDefault();
      close();
    }
  }
  dlg.querySelector("#end-stay").onclick = close;
  dlg.querySelector("#end-go").onclick = () => { close(); finish(); };
  dlg.addEventListener("click", ev => { if (ev.target === dlg) dlg.querySelector("#end-stay").focus(); }, 0);
  document.addEventListener("keydown", onKey, true);
  document.body.appendChild(dlg);
  dlg.querySelector("#end-stay").focus();
}

/* ================= ACCUEIL ================= */
// opts.noHistory : home() a été atteint par le bouton retour (l'entrée est déjà consommée).
// Une confirmation ouverte ne peut pas être contournée par un appel direct : elle garde le premier plan.
function home(opts = {}) {
  if (!opts.noHistory && !opts.silent && document.querySelector(".dialog")) return;   // confirmation en cours
  if (examSession) persistExam();   // rien ne se perd, même par un appel direct
  const fromBack = !!opts.noHistory && askedOnBack;   // on s'est arrêté sur le bouton retour : on reste
  askedOnBack = false;
  document.getElementById("brand").classList.remove("skipfocused");
  document.querySelectorAll(".dialog").forEach(d => d.remove());   // l'accueil ferme un panneau resté ouvert
  if (examSession) {
    if (examSession.st.tick) clearInterval(examSession.st.tick);
    if (examSession.detach) examSession.detach();   // clavier et horloge de cette épreuve ne répondent plus
  }
  examSession = null;
  sheetWanted = false;
  document.body.classList.remove("sheet-open");
  if (!opts.noHistory && histPushed && history.state && history.state.exam) {
    histPushed = false;
    if (location.hash === "#" + EXAM_MARK) history.replaceState(history.state, "", location.pathname + location.search);
    else if (fromBack) {   // l'épreuve est derrière : on ne repousse pas d'entrée « examen » pour rien
      history.replaceState({ exam: true }, "", location.pathname + location.search + "#" + EXAM_MARK);
      history.back();
    } else history.back();   // sortie explicite : on ne laisse pas d'entrée « examen » derrière soi
  }

  setBar(isPublic ? "Test gratuit · 40 questions" : "Examen civique — entraînement", "");
  document.title = isPublic ? "Test gratuit — examen civique" : "Examen civique — entraînement hors ligne";

  const resumed = resumeInfo();
  const resumeHTML = resumed ? `
    <div class="resume" id="resume">
      <p>Reprendre l’examen blanc ${resumed.e.idx + 1} — question ${resumed.cur + 1} sur ${resumed.total}, temps restant ${fmtTime(resumed.e.left)}</p>
      <button class="btn" onclick="startExam(${resumed.e.idx}, true)">Reprendre</button>
    </div>` : "";

  const exams = DATA.exams.map((e, i) => {
    const best = state.best["ex" + i];
    return `<button class="row" onclick="startExam(${i})">
      <span class="num">${String(i + 1).padStart(2, "0")}</span>
      <span class="body">
        <span class="title">Examen blanc ${i + 1}</span>
        <span class="sub">40 questions · 45 minutes · 32 sur 40 pour réussir</span>
      </span>
      <span class="best">${best !== undefined ? "record " + best + "/40" : ""}</span>
      <span class="chev">›</span>
    </button>`;
  }).join("");

  const themes = DATA.themes.map(t => {
    const qs = DATA.questions.filter(q => q.theme === t.n);
    if (!qs.length) return "";
    const done = state.done["t" + t.n] || 0;
    return `<button class="row" onclick="startTheme(${t.n})">
      <span class="num">${t.n}</span>
      <span class="body">
        <span class="title">${esc(t.title)}</span>
        <span class="sub">${qs.length} questions${done ? " · " + done + " vues" : ""}</span>
      </span>
      <span class="chev">›</span>
    </button>`;
  }).join("");

  $("#app").innerHTML = `
  <div class="main">
    <p class="eyebrow">${isPublic ? "Sans compte, sans email" : "Fonctionne hors ligne"}</p>
    <h1>${isPublic ? "Un examen blanc complet, gratuit" : "S’entraîner sur les 259 questions de l’examen civique"}</h1>
    <p class="lede">${isPublic
      ? "40 questions, 45 minutes, correction et explications à la fin. Aucune inscription, aucun envoi de données."
      : "Questions officielles et examens blancs au format réel : 40 questions, 45 minutes, 32 sur 40 pour réussir. Tout reste sur votre appareil."}</p>

    <div class="facts">
      <div class="fact"><b>40</b><span>questions par examen</span></div>
      <div class="fact"><b>45</b><span>minutes</span></div>
      <div class="fact"><b>32/40</b><span>seuil de réussite</span></div>
    </div>

    <p style="margin:22px 0 4px"><button class="btn" style="width:100%" onclick="startExam(0)">${isPublic ? "Commencer l’examen blanc" : "Lancer un examen blanc"}</button></p>
    <h2>Les sujets</h2>
    ${resumeHTML}
    <div class="list">${exams}</div>
    ${isPublic ? "" : `<h2>Réviser thème par thème</h2><div class="list">${themes}</div>`}
    <p class="note">${isPublic
      ? "Ce test gratuit contient 40 questions tirées de la liste officielle. Le pack complet comprend les 259 questions, 5 examens blancs, l’audio des 259 questions et le PDF."
      : "Vos scores sont enregistrés dans ce navigateur uniquement. Aucun serveur, aucune donnée envoyée."}</p>
  </div>
  <aside class="aside desktop-only">
    <div class="sheet">
      <h3>Une copie corrigée</h3>
      <div class="grid">${Array.from({length: 40}, (_, k) => {
        const ko = [12, 27].includes(k), blank = k === 38;
        const cls = blank ? "blank" : ko ? "ko" : "ok";
        return `<span class="cell ${cls}">${k + 1}</span>`;
      }).join("")}</div>
      <div class="legend"><span><i class="l-ok"></i>juste</span><span><i class="l-ko"></i>fausse</span><span><i class="l-blank"></i>sans réponse</span></div>
      <div class="count"><b>37</b> sur 40 · <b>92 %</b></div>
      <p class="note" style="margin-top:12px">Le corrigé est rendu à la fin de l’épreuve, jamais pendant : c’est la règle de l’examen réel.</p>
    </div>
  </aside>`;
  homeShown = true;
}

/* ================= RÉVISION ================= */
function startTheme(n) {
  const qs = shuffle(DATA.questions.filter(q => q.theme === n), Date.now() & 0xffff);
  revision(qs, n, 0, 0, []);
}

function revision(qs, theme, i, score, marks) {
  if (i >= qs.length) return endRevision(qs, theme, score, marks);
  const q = qs[i], opts = optsOf(q), good = opts.indexOf(q.answer);

  setBar(`Thème ${theme} · ${esc(THEMES[theme])} · Révision`,
         `<span class="clock" style="font-size:.86rem;background:none;border:0;padding:0">${i + 1} / ${qs.length}</span>`);

  $("#app").innerHTML = `
  <div class="main">
    <div class="qhead"><span class="tag">Question ${i + 1}</span><span class="theme">${esc(THEMES[theme])}</span></div>
    <p class="qtext">${esc(q.question)}</p>
    <div class="opts" id="opts" role="group" aria-label="Propositions">
      ${opts.map((o, k) => `<button class="opt" data-v="${k}"><span class="k">${LETTERS[k]}</span><span>${esc(o)}</span></button>`).join("")}
    </div>
    <div id="fb" class="fb hidden" role="status" aria-live="polite"></div>
    <div class="actionbar">
      <button class="btn" id="next" disabled>Question suivante</button>
    </div>
  </div>
  <aside class="aside desktop-only">
    <div class="sheet">
      <h3>Progression</h3>
      <div class="grid">${qs.map((_, k) => `<span class="cell ${marks[k] === 1 ? "ok" : marks[k] === 0 ? "ko" : ""} ${k === i ? "cur" : ""}">${k + 1}</span>`).join("")}</div>
      <div class="legend"><span><i class="l-ok"></i>juste</span><span><i class="l-ko"></i>fausse</span></div>
      <div class="count">Score : <b>${score}</b> / ${i}</div>
    </div>
  </aside>`;

  $("#opts").addEventListener("click", ev => {
    const b = ev.target.closest(".opt");
    if (!b || $("#opts").dataset.done) return;
    $("#opts").dataset.done = "1";
    const k = +b.dataset.v, ok = k === good;
    [...document.querySelectorAll(".opt")].forEach(x => {
      const kk = +x.dataset.v;
      x.disabled = true;
      if (kk === good) x.classList.add("right");
      else if (kk === k) x.classList.add("wrong");
    });
    const fb = $("#fb");
    fb.className = "fb " + (ok ? "good" : "bad");
    fb.innerHTML = `<span class="verdict">${ok ? "Correct" : "Réponse exacte : " + LETTERS[good]}</span>${q.explication ? esc(q.explication) : ""}`;
    fb.classList.remove("hidden");
    const nb = $("#next");
    nb.disabled = false;
    nb.onclick = () => revision(qs, theme, i + 1, score + (ok ? 1 : 0), [...marks, ok ? 1 : 0]);
    nb.focus();
  });

  document.addEventListener("keydown", keyNav);
  function keyNav(e) {
    // un panneau ouvert au-dessus (confirmation, feuille « Grille ») : le raccourci ne touche pas la page
    if (document.querySelector(".dialog") || sheetIsOpen()) return;
    if (e.key >= "1" && e.key <= "4" && !$("#opts").dataset.done) {
      const b = document.querySelector(`.opt[data-v="${+e.key - 1}"]`);
      if (b) b.click();
    } else if (e.key === "Enter" && !$("#next").disabled) {
      e.preventDefault(); $("#next").click();
    }
  }
}

function endRevision(qs, theme, score, marks) {
  const pct = Math.round(score / qs.length * 100);
  const pass = score / qs.length >= 0.8;
  setBar(`Thème ${theme} · Révision terminée`, "");
  $("#app").innerHTML = `
  <div class="main">
    <p class="eyebrow">Thème ${theme} — ${esc(THEMES[theme])}</p>
    <h1>Révision terminée</h1>
    <p class="score ${pass ? "pass" : "fail"}">${score}/${qs.length}</p>
    <p class="verdict-line">${pct} % de réponses justes. Le seuil de l’examen est de 32 sur 40, soit 80 %.</p>
    <div class="threshold"><div class="fill" style="width:${pct}%"></div><div class="mark"></div><span class="lbl">seuil 80 %</span></div>

    <div class="packcta">
      <h3>Réviser ce que vous venez de rater</h3>
      <p>Les corrections ci-dessous disent <em>quoi</em> revoir. Le pack donne le <em>pourquoi</em> :
      les 259 questions avec l’explication écrite, les mêmes en audio (2 h 48) pour les écouter
      en déplacement, et cinq examens blancs corrigés pour prendre le rythme des 45 minutes.</p>
      <p class="packcta-prix">19&nbsp;€ une fois, sans abonnement — téléchargement immédiat.</p>
      <div class="packcta-l">
        <a class="btn" href="/fr/">Voir le pack — 19&nbsp;€</a>
        <a class="packcta-2" href="/fr/audio/">Écouter un extrait</a>
      </div>
    </div>

    <h2>Questions à revoir</h2>
    ${qs.map((q, k) => marks[k] === 0 ? `<div class="review">
      <div class="tag" style="font:600 .74rem/1 var(--mono);color:var(--ink3)">Question ${k + 1}</div>
      <p class="rq">${esc(q.question)}</p>
      <p class="rl yes">Bonne réponse : ${esc(q.answer)}</p>
      ${q.explication ? `<p class="rx">${esc(q.explication)}</p>` : ""}
    </div>` : "").join("") || `<p class="note">Aucune erreur sur ce thème.</p>`}
    <div class="actionbar"><button class="btn" onclick="home()">Revenir à l’accueil</button></div>
  </div>
  <aside class="aside desktop-only">
    <div class="sheet">
      <h3>Feuille de réponses</h3>
      <div class="grid">${qs.map((_, k) => `<span class="cell ${marks[k] === 1 ? "ok" : "ko"}">${k + 1}</span>`).join("")}</div>
      <div class="legend"><span><i class="l-ok"></i>juste</span><span><i class="l-ko"></i>fausse</span></div>
    </div>
  </aside>`;
}

/* ================= EXAMEN ================= */
const PUSH = () => history.pushState({ exam: true }, "", location.pathname + location.search + "#" + EXAM_MARK);

// pushed : l'entrée d'historique « examen » vient d'être posée (Échap devant le bouton retour)
function startExam(idx, resume, pushed) {
  // même épreuve encore valide mais effacée de l'écran (accueil, résultats) : on la réaffiche telle
  // quelle, sans perdre son écouteur clavier ni la position de la question.
  // réouverture par le bouton retour/avant du navigateur : on reprend l'épreuve gardée à la confirmation
  if (!resume && !examSession && resumeInfo()) resume = true;
  // aucune trace d'examen n'est effacée avant l'affichage de la nouvelle épreuve : un clic détourné
  // (logo sous une confirmation, bouton retour en plein défilement mobile) ne doit pas perdre la copie
  const qs = DATA.exams[idx].map(id => byId[id]).filter(Boolean);
  const total = qs.length;
  const saved = resume ? state.exam : null;
  const same = !!(saved && saved.idx === idx && saved.left > 0);

  // état de l'épreuve : restauré s'il en existe un pour ce même examen, sinon neuf
  const st = {
    cur: same ? Math.min(Math.max(+saved.cur || 0, 0), total - 1) : 0,
    answers: {},
    left: same ? Math.floor(saved.left) : 45 * 60,
    tick: null,
    ended: false,
    started: same ? (saved.started || Date.now()) : Date.now(),
  };
  if (same && saved.answers && typeof saved.answers === "object") {
    Object.keys(saved.answers).forEach(k => {
      if (+k >= 0 && +k < total && saved.answers[k] !== undefined) st.answers[+k] = saved.answers[k];
    });
  }

  examSession = { idx, qs, st };
  examStarted++;
  // une seule entrée d'historique par onglet : revenir en arrière pendant l'épreuve
  // revient à l'accueil, que popstate intercepte pour demander confirmation.
  if (!pushed && !(histPushed && history.state && history.state.exam)) { PUSH(); histPushed = true; }

  // « Terminer » discret : simple lien-texte, jamais un bouton plein. La colonne de droite et le
  // panneau le portent tous deux (data-end) ; openSheet() lui branche la confirmation puis finish().
  const endLink = () => `<button type="button" class="finishlink" data-end="1">Terminer l’examen</button>`;
  const finish = () => {
    if (st.ended) return;
    st.ended = true;
    clearInterval(st.tick);
    document.removeEventListener("keydown", keyNav);
    clearExam();   // l'épreuve est terminée : plus rien à reprendre
    let score = 0; const wrong = [];
    qs.forEach((q, k) => {
      const opts = optsOf(q);
      const chosen = st.answers[k];
      if (chosen !== undefined && opts[chosen] === q.answer) score++;
      else wrong.push({ k, q, chosen, good: opts.indexOf(q.answer), opts });
    });
    if (state.best["ex" + idx] === undefined || score > state.best["ex" + idx]) state.best["ex" + idx] = score;
    save();
    results(qs, idx, score, wrong, 45 * 60 - st.left);
  };

  // nombre de réponses données (feuille, confirmation de fin)
  const answered = () => Object.keys(st.answers).length;
  const blank = () => total - answered();

  const timerHTML = () => `<span class="clock${st.left <= 300 ? " low" : ""}" id="t">${fmtTime(st.left)}</span>`;
  const quitBtn = `<button type="button" class="btn ghost quitbtn" id="quit" aria-haspopup="dialog">Quitter</button>`;
  const gridBtn = `<button type="button" class="btn ghost gridbtn" id="gridbtn" aria-expanded="false" aria-controls="sheet">Grille</button>`;
  const drawBar = () => setBar(`Examen blanc ${idx + 1} · Simulation`, timerHTML() + gridBtn + quitBtn);
  drawBar();
  $("#quit").onclick = () => confirmQuit();
  $("#gridbtn").onclick = () => {
    if (sheetIsOpen()) closeSheet();
    else openSheet(finish, total, answered);
  };

  // demande de sortie : bouton Quitter ou bouton retour du navigateur
  const confirmQuit = () => askQuit({
    action: () => { persistExam(); home(); },   // ne pas re-pousser d'entrée : home() gère l'historique
  });

  const sheetHTML = wrap => `
    <h3>Feuille de réponses</h3>
    <div class="grid${wrap ? " wrap" : ""}">${qs.map((_, k) => `<button class="cell ${st.answers[k] !== undefined ? "done" : ""} ${k === st.cur ? "cur" : ""}" data-i="${k}" aria-label="Question ${k + 1}${st.answers[k] !== undefined ? ", répondue" : ""}">${k + 1}</button>`).join("")}</div>
    <div class="legend"><span><i style="background:var(--ink);border-color:var(--ink)"></i>répondue</span><span><i class="l-blank"></i>à faire</span></div>
    <div class="count sheet-count"><b>${answered()}</b> / ${total} répondues</div>
    ${endLink()}`;

  // une case de la feuille (colonne de droite ou panneau « Grille ») mène à sa question ;
  // render() réaffiche la feuille sans refermer le panneau
  const goTo = k => {
    st.cur = k;
    render(".opt");
  };
  const sheetClick = ev => {
    const b = ev.target.closest(".cell");
    if (b && b.dataset.i !== undefined) { closeSheet(); goTo(+b.dataset.i); }
  };

  // focusTo : seulement pour les cases de la feuille, l'ouverture du panneau, le clavier
  const render = (focusSel, focusTo) => {
    if (!examSession || st.ended) return;
    persistExam();   // à chaque réponse et à chaque changement de question
    const q = qs[st.cur], opts = optsOf(q);
    const last = st.cur === total - 1;
    const keep = sheetWanted;   // panneau voulu ouvert : la copie fraîche sera réaffichée
    $("#app").innerHTML = `
    <div class="main">
      <div class="qhead">
        <span class="tag">Question ${st.cur + 1} / ${total}</span>
        <span class="theme">${esc(THEMES[q.theme] || "")}</span>
      </div>
      <p class="qtext" tabindex="-1">${esc(q.question)}</p>
      <div class="opts" id="opts" role="group" aria-label="Propositions">
        ${opts.map((o, k) => `<button class="opt${st.answers[st.cur] === k ? " sel" : ""}" data-v="${k}" aria-pressed="${st.answers[st.cur] === k}">
          <span class="k">${LETTERS[k]}</span><span>${esc(o)}</span></button>`).join("")}
      </div>
      <div class="actionbar">
        <button class="btn ghost" id="prev" ${st.cur === 0 ? "disabled" : ""}>Précédent</button>
        <button class="btn" id="next">${last ? "Terminer l’examen" : "Suivant"}</button>
      </div>
    </div>
    <aside class="aside desktop-only">
      <div class="sheet" id="sheet" data-side style="display:block">${sheetHTML()}</div>
    </aside>
    <div class="sheet-panel" id="sheet-panel" role="dialog" aria-modal="true" aria-label="Feuille de réponses">
      <div class="sheet-panel-head"><h3>Feuille de réponses</h3>
        <button type="button" class="btn ghost quitbtn" id="sheet-close">Fermer</button></div>
      <div class="sheet">${sheetHTML(true)}</div>
    </div>
    <div class="sheet-scrim" hidden></div>`;

    const sheet = $("#sheet"), panelEl = $("#sheet-panel");
    sheet.addEventListener("click", sheetClick);
    panelEl.addEventListener("click", sheetClick);
    $("#sheet-close").onclick = () => closeSheet();
    document.querySelector(".aside [data-end]").onclick =
      e => askFinish(finish, e.currentTarget, blank(), total);   // « Terminer » de la colonne de droite
    if (keep) syncSheet();   // sur le nouveau panneau (jamais sur l'ancien #sheet, masquée sur mobile)

    $("#opts").addEventListener("click", ev => {
      const b = ev.target.closest(".opt");
      if (!b) return;
      st.answers[st.cur] = +b.dataset.v;
      render(`.opt[data-v="${b.dataset.v}"]`, true);   // render() sauvegarde et garde le focus sur le même choix
    });
    $("#prev").onclick = () => { if (st.cur > 0) { st.cur--; render(); } };
    $("#next").onclick = () => {
      if (!last) { st.cur++; render(); }
      else askFinish(finish, $("#next"), blank(), total);   // confirmation : l'examen va être corrigé
    };
    if (focusSel) { const el = document.querySelector(focusSel); if (el && focusTo) el.focus(); }
  };

  // navigation clavier, branchée une fois par épreuve (la page n'est jamais rechargée)
  const keyNav = e => {
    if (!examSession || examSession.st !== st || st.ended) return;   // ce gestionnaire n'agit que sur l'épreuve de l'onglet
    if (document.querySelector(".dialog") || !document.getElementById("opts")) return;  // autre écran
    if (e.key === "Escape" && sheetIsOpen()) {   // Échap referme la feuille de réponses
      e.preventDefault();
      closeSheet();
      const g = document.getElementById("gridbtn");
      if (g) g.focus();
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key >= "1" && e.key <= "4") {
      if (!e.shiftKey) {   // Maj+1 à 4 : numéros de question de la feuille
        const b = document.querySelector(`.opt[data-v="${+e.key - 1}"]`);
        if (b) b.click();
        return;
      }
    }
    if (e.key === "ArrowLeft" && st.cur > 0) { st.cur--; render("#prev:not([disabled])"); }
    else if (e.key === "ArrowRight" && st.cur < total - 1) { st.cur++; render(".opt"); }
  };
  document.addEventListener("keydown", keyNav);
  examSession.detach = () => { st.ended = true; clearInterval(st.tick); document.removeEventListener("keydown", keyNav); };

  render();

  // temps épuisé pendant que l'onglet était fermé : on rend la copie telle quelle
  if (st.left <= 0) return finish();

  const mine = examStarted;
  st.tick = setInterval(() => {
    if (mine !== examStarted) { clearInterval(st.tick); return; }   // épreuve relancée depuis
    st.left--;
    if (st.left % 5 === 0) persistExam();   // toutes les 5 s suffisent pour le stockage
    const el = document.getElementById("t");
    if (el) {
      el.textContent = fmtTime(st.left);
      el.classList.toggle("low", st.left <= 300);
    }
    if (st.left <= 0) finish();
  }, 1000);
}

// Retour arrière du navigateur pendant l'épreuve : on ne quitte pas la page,
// on pose la même question, sur l'accueil déjà affiché. L'adresse perd #examen (l'épreuve
// n'est plus affichée) : un second retour pendant la confirmation ne peut pas sortir de la page.
addEventListener("popstate", () => {
  // une confirmation est ouverte : elle gère elle-même le bouton retour (voir backAfterDismiss).
  // (Le panneau « Grille » n'est pas concerné : il doit laisser passer la navigation.)
  if (document.querySelector(".dialog")) return;
  if (examSession) {
    const st = examSession.st;
    if (st.tick) clearInterval(st.tick);
    st.tick = null;
    persistExam();
    examSession = null;
    histPushed = false;   // l'entrée « examen » vient d'être consommée
    /*DBGMARK*/askedOnBack = true;
    home({ noHistory: true });
    // home() vient d'afficher la reprise : c'est elle qu'on sauvegarde si l'on confirme
    askQuit({ action: () => { resumeInfo(); home(); }, backAfterDismiss: true });
    return;
  }
  // page ouverte directement sur #examen (sans épreuve) : on ramène proprement à l'accueil
  if (homeShown) return;
  if (location.hash === "#" + EXAM_MARK) history.replaceState(history.state, "", location.pathname + location.search);
  home({ noHistory: true });
});

// ================= LOGO = Lien vers la racine du site =================
// Avant de quitter la page, on sauvegarde l'examen en cours ; la navigation vers / se fait ensuite
// normalement. Si l'historique contient une entrée « examen », on reste sur l'accueil de cette page
// (dépilement de cette entrée, puis de celles empilées éventuellement juste avant — une entrée
// « examen » voisine n'est jamais traversée) : sans cela, le bouton retour ramènerait l'ancien
// écran d'épreuve par-dessus l'accueil du site.
function goHomeLink(ev) {
  persistExam();   // une confirmation ouverte couvre l'écran : ce clic ne peut pas l'atteindre
  if (!(histPushed && history.state && history.state.exam)) return false;   // rien à dépiler : lien normal
  ev.preventDefault();
  histPushed = false;
  const leaveNow = () => {
    if (location.hash === "#" + EXAM_MARK) history.replaceState(history.state, "", location.pathname + location.search);
    location.assign("/");
  };
  try {
    if (history.state && history.state.exam) history.back();
    else leaveNow();
  } catch (e) { leaveNow(); }
  return true;
}
// l'entrée « examen » est consommée ; on repart de l'accueil de la page avant de suivre le lien
addEventListener("popstate", () => {
  if (!homeShown) home({ noHistory: true });
  location.assign("/");
});

// lien CTA (pack, extrait audio) cliqué pendant l'épreuve : la copie est gardée avant de suivre le lien
addEventListener("click", ev => {
  const a = ev.target.closest && ev.target.closest('a[href^="/"]');
  if (a && examSession && !examSession.st.ended) persistExam();
}, true);

document.getElementById("brand").addEventListener("click", ev => { if (goHomeLink(ev)) ev.preventDefault(); });

// Mesure : événement « fin » envoyé une seule fois par page, au premier affichage du résultat.
// s/m/c : utm_source/utm_medium/utm_campaign de l'URL, sinon celles du premier contact
// (localStorage "embrun_src", remplacé par toute nouvelle utm_source dans l'URL).
let finSent = false;
function trackFin(score, total) {
  if (finSent) return;
  finSent = true;
  try {
    const K = "embrun_src", q = new URLSearchParams(location.search);
    const g = n => { const v = q.get(n); return v && v.trim() ? v.trim().slice(0, 80) : ""; };
    let st = {};
    try { st = JSON.parse(localStorage.getItem(K) || "{}") || {}; } catch (e) { st = {}; }
    if (typeof st !== "object") st = {};
    const s = g("utm_source"), m = g("utm_medium"), c = g("utm_campaign");
    if (s) { st = { s, m, c }; try { localStorage.setItem(K, JSON.stringify(st)); } catch (e) {} }
    const body = JSON.stringify({ p: "/entrainement", e: "fin", v: Math.round(score / total * 40 * 100) / 100,
      s: st.s || "", m: st.m || "", c: st.c || "" });
    const u = (window.EMB_BASE||"https://openclaw-vm.tail5af44b.ts.net:8443")+"/hit";
    if (navigator.sendBeacon && navigator.sendBeacon(u, new Blob([body], { type: "text/plain;charset=UTF-8" }))) return;
    try {
      const x = new XMLHttpRequest();
      x.open("POST", u, true);
      x.setRequestHeader("Content-Type", "text/plain;charset=UTF-8");
      x.send(body);
    } catch (e) { fetch(u, { method: "POST", mode: "no-cors", body }).catch(() => {}); }
  } catch (e) {}
}

function results(qs, idx, score, wrong, used) {
  const total = qs.length;
  trackFin(score, total);
  clearExam();   // fin d'épreuve : plus rien à reprendre (couvre aussi les reprises invalides)
  const pass = score / total >= 0.8;
  const mins = Math.floor(used / 60), secs = used % 60;
  setBar(`Examen blanc ${idx + 1} · Résultat`, "");
  $("#app").innerHTML = `
  <div class="main">
    <p class="eyebrow">Examen blanc ${idx + 1} — corrigé</p>
    <h1>${score} sur ${total}</h1>
    <p class="score ${pass ? "pass" : "fail"}">${Math.round(score / total * 100)} %</p>
    <p class="verdict-line">${pass
      ? "Au-dessus du seuil de réussite. À l’épreuve réelle, 32 sur 40 suffisent."
      : "Sous le seuil de 32 sur 40. Il manque " + (32 - score) + " point" + ((32 - score) > 1 ? "s" : "") + "."} Temps utilisé : ${mins} min ${String(secs).padStart(2, "0")} s.</p>
    <div class="threshold"><div class="fill" style="width:${Math.round(score / total * 100)}%"></div><div class="mark"></div><span class="lbl">seuil 80 %</span></div>

    <div class="packcta">
      <h3>Réviser ce que vous venez de rater</h3>
      <p>Les corrections ci-dessous disent <em>quoi</em> revoir. Le pack donne le <em>pourquoi</em> :
      les 259 questions avec l’explication écrite, les mêmes en audio (2 h 48) pour les écouter
      en déplacement, et cinq examens blancs corrigés pour prendre le rythme des 45 minutes.</p>
      <p class="packcta-prix">19&nbsp;€ une fois, sans abonnement — téléchargement immédiat.</p>
      <div class="packcta-l">
        <a class="btn" href="/fr/">Voir le pack — 19&nbsp;€</a>
        <a class="packcta-2" href="/fr/audio/">Écouter un extrait</a>
      </div>
    </div>


    <h2>À revoir (${wrong.length})</h2>
    ${wrong.map(w => `<div class="review">
      <div class="tag" style="font:600 .74rem/1 var(--mono);color:var(--ink3)">Question ${w.k + 1}</div>
      <p class="rq">${esc(w.q.question)}</p>
      <p class="rl no">Votre réponse : ${w.chosen === undefined ? "aucune" : LETTERS[w.chosen] + ". " + esc(w.opts[w.chosen])}</p>
      <p class="rl yes">Bonne réponse : ${LETTERS[w.good]}. ${esc(w.q.answer)}</p>
      ${w.q.explication ? `<p class="rx">${esc(w.q.explication)}</p>` : ""}
    </div>`).join("") || `<p class="note">Aucune erreur. Vous êtes au niveau de l’épreuve.</p>`}

    <div class="actionbar"><button class="btn" onclick="home()">Revenir à l’accueil</button></div>
  </div>
  <aside class="aside desktop-only">
    <div class="sheet">
      <h3>Feuille de réponses</h3>
      <div class="grid">${qs.map((q, k) => {
        const chosen = (wrong.find(w => w.k === k) || {}).chosen;
        const isWrong = wrong.some(w => w.k === k);
        const cls = !isWrong ? "ok" : chosen === undefined ? "blank" : "ko";
        return `<span class="cell ${cls}">${k + 1}</span>`;
      }).join("")}</div>
      <div class="legend"><span><i class="l-ok"></i>juste</span><span><i class="l-ko"></i>fausse</span><span><i class="l-blank"></i>sans réponse</span></div>
      <div class="count"><b>${score}</b> justes · <b>${wrong.length}</b> à revoir</div>
    </div>
  </aside>`;
}

// lien d'évitement « Aller au contenu » : le contenu reçoit le focus ; au Tab suivant, on passe
// au logo de la barre (keydown émis sur le nouvel élément avant le déplacement du focus par la touche Tab)
let skipTab = false;
document.querySelector(".skip").addEventListener("click", ev => {
  ev.preventDefault();
  const m = document.querySelector("#app .main");
  if (!m) return;
  m.setAttribute("tabindex", "-1");
  skipTab = true;
  m.focus();
});
document.querySelector("#app").addEventListener("focusin", ev => {
  if (!skipTab || !ev.target.classList.contains("main")) return;
  skipTab = false;
  ev.target.addEventListener("keydown", function onTab(e) {
    if (e.key !== "Tab" || e.shiftKey) return;
    ev.target.removeEventListener("keydown", onTab);
    e.preventDefault();
    const b = document.getElementById("brand");
    b.classList.add("skipfocused");
    b.focus();
  });
});
document.getElementById("brand").addEventListener("blur", ev => ev.target.classList.remove("skipfocused"));

// ouverture directe d'un lien ...#examen (favori, onglet rouvert) : on repart de l'accueil
if (location.hash === "#" + EXAM_MARK) history.replaceState(history.state, "", location.pathname + location.search);
home();

/* ---- auto-test (usage interne : ?selftest) ---- */
if (location.search.includes("selftest")) (async () => {
  const res = {};
  try {
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const sheetOpen = () => !!document.querySelector(".sheet-scrim:not([hidden])");
    const qtag = () => (document.querySelector(".qhead").textContent || "").trim();

    res.rows = document.querySelectorAll(".row").length;
    res.cssw = getComputedStyle(document.querySelector(".shell")).gridTemplateColumns;

    /* révision d'un thème */
    startTheme(1);
    res.qtext = document.querySelector(".qtext").textContent.slice(0, 40);
    res.opts = document.querySelectorAll(".opt").length;
    document.querySelectorAll(".opt")[0].click();
    res.feedback = document.querySelector("#fb").textContent.slice(0, 40);
    res.nextEnabled = !document.querySelector("#next").disabled;

    /* logo : <a href="/"> */
    const brand = document.getElementById("brand");
    res.logoHref = brand.getAttribute("href");
    res.logoText = brand.textContent.replace(/\s+/g, " ").trim();
    res.logoColor = getComputedStyle(brand).color;
    res.logoUnderline = getComputedStyle(brand).textDecorationLine;

    /* épreuve : réponse sauvegardée, confirmation de sortie, reprise */
    startExam(0);
    res.examCells = document.querySelectorAll("#sheet .cell").length;
    res.timer = document.querySelector("#t").textContent;
    res.answered = document.querySelectorAll(".cell.done").length;
    document.querySelector(".opt").click();
    res.answered = document.querySelectorAll("#sheet .cell.done").length;
    document.querySelector("#quit").focus();   // render() a rendu le focus au choix : on le rapporte sur Quitter
    res.saved = !!(state.exam && state.exam.idx === 0 && state.exam.answers["0"] !== undefined);
    document.querySelector("#quit").click();
    const dlgQuit = document.querySelector(".dialog");   // pas [role="dialog"] : le panneau « Grille » en porte un aussi
    res.dialog = !!dlgQuit && document.activeElement === dlgQuit.querySelector("#quit-stay");
    document.activeElement.dispatchEvent(new KeyboardEvent("keydown", { key: "Tab", bubbles: true }));
    res.trap = dlgQuit.contains(document.activeElement) && document.activeElement.id === "quit-leave";
    document.querySelector("#quit-stay").click();
    res.closed = !document.querySelector(".dialog") && !!document.querySelector("#opts");
    document.querySelector("#quit").click();
    document.querySelector("#quit-leave").click();
    res.home = !!document.querySelector("#resume");
    res.resume = res.home && document.querySelector("#resume").textContent.replace(/\s+/g, " ").trim();
    // l'entrée « examen » de l'épreuve quittée reste en place ; « Reprendre » repart d'une épreuve neuve
    res.resumeKept = document.querySelector("#resume").textContent.indexOf("question 1 sur 40") >= 0;
    document.querySelector("#resume button").click();
    document.querySelector('.opt[data-v="3"]').click();   // la reprise rend les choix actifs
    const before3 = document.querySelector('.opt[data-v="2"]').classList.contains("sel");
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "2", bubbles: true }));   // raccourci encore actif
    res.shortcutAfterDialog = !before3 && document.querySelector('.opt[data-v="1"]').classList.contains("sel");
    res.savedAnswers = res.resumeKept && !!(state.exam && state.exam.idx === 0 && state.exam.answers[0] !== undefined);

    /* feuille de réponses */
    startExam(0, true);
    res.sideCells = document.querySelectorAll("#sheet .cell").length;
    res.panelRole = ["role", "aria-modal", "aria-label"]
      .map(a => document.getElementById("sheet-panel").getAttribute(a)).join("/");
    res.sideFinish = document.querySelectorAll(".aside .finishlink").length;
    res.panelFinish = document.querySelectorAll("#sheet-panel .finishlink").length;
    const fl = document.querySelector(".aside .finishlink");
    const fcs = getComputedStyle(fl);
    res.finishPlain = fcs.backgroundImage === "none" && parseFloat(fcs.borderTopWidth) === 0
      && fcs.textDecorationLine === "underline" && Math.round(fl.getBoundingClientRect().height) < 40;
    const gridBtn = document.getElementById("gridbtn");
    res.gridVisible = getComputedStyle(gridBtn).display !== "none";
    // ouverture / fermeture / réouverture, trois cycles
    const cycles = [];
    for (let c = 0; c < 3; c++) {
      gridBtn.click();
      const p = document.getElementById("sheet-panel");
      cycles.push({ open: sheetOpen() && getComputedStyle(p).visibility === "visible", aria: gridBtn.getAttribute("aria-expanded") });
      document.getElementById("sheet-close").click();
      cycles.push({ closed: !sheetOpen() && !p.classList.contains("open") && getComputedStyle(p).visibility === "hidden", aria: gridBtn.getAttribute("aria-expanded") });
    }
    res.cycles = cycles.map(o => Object.values(o)[0]);
    res.reopen = res.cycles.every((v, i) => v === (i % 2 === 0));
    gridBtn.click();
    res.sheetOpen = sheetOpen() && gridBtn.getAttribute("aria-expanded") === "true";
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    res.sheetClosedByEsc = !sheetOpen() && gridBtn.getAttribute("aria-expanded") === "false";
    gridBtn.click();
    document.querySelector(".sheet-scrim").click();
    res.sheetClosedByScrim = !sheetOpen();
    gridBtn.click();
    document.querySelectorAll("#sheet-panel .cell")[4].click();
    res.navByCell = document.querySelector(".qhead .tag").textContent.indexOf("5 /") >= 0 && !sheetOpen();
    document.querySelector(".aside .cell[data-i='9']").click();
    res.navBySide = !sheetOpen() && document.querySelector(".qhead .tag").textContent.indexOf("10 /") >= 0;
    startExam(0, true);   // épreuve neuve ; la révision précédente a laissé l'historique en place
    document.querySelector("#gridbtn").click();
    document.querySelector('#sheet-panel [data-end]').click();
    let dlg = document.querySelector(".dialog");
    res.endPanel = !!dlg && dlg.textContent.indexOf("sera corrigé") >= 0 && !sheetOpen();
    dlg.querySelector("#end-stay").click();
    res.endStay = !document.querySelector(".dialog") && !!document.querySelector("#opts");
    startExam(0, true);
    document.querySelector(".aside .finishlink").click();
    dlg = document.querySelector(".dialog");
    res.endSide = !!dlg && dlg.textContent.indexOf("sera corrigé") >= 0 && !sheetOpen();
    dlg.querySelector("#end-go").click();
    res.finishWorks = !!document.querySelector(".score") && !document.querySelector("#opts");
    // le panneau ouvert survit à un réaffichage (réponse choisie) sans se refermer
    startExam(0, true);
    document.querySelector("#gridbtn").click();
    document.querySelector(".opt[data-v='0']").click();
    res.staysOpenOnAnswer = sheetOpen() && getComputedStyle(document.getElementById("sheet-panel")).visibility === "visible"
      && document.getElementById("sheet-panel").classList.contains("open");
    await sleep(300);
    res.staysOpenAfterDelay = sheetOpen() && getComputedStyle(document.getElementById("sheet-panel")).visibility === "visible";
    document.querySelector("#sheet-close").click();
    await sleep(260);
    const pc = document.getElementById("sheet-panel");
    res.hiddenAfterClose = !pc.classList.contains("open") && getComputedStyle(pc).transform !== "none" && !sheetOpen()
      && document.querySelector(".sheet-scrim").hidden && getComputedStyle(document.querySelector(".sheet-scrim")).display === "none";
    document.querySelector("#gridbtn").click();
    res.reopenAfterRemove = sheetOpen() && getComputedStyle(document.getElementById("sheet-panel")).visibility === "visible";
    document.querySelector("#gridbtn").click();
    res.toggleCloses = !sheetOpen();
    // drapeau : dans la barre, entre le logo et le nom de l'examen
    const flag = document.querySelector(".topbar .brandgroup > .flag");
    const kids = flag ? [...flag.parentElement.children] : [];
    res.flagOrder = kids.indexOf(document.getElementById("brand")) + "," + kids.indexOf(flag) + "," + kids.indexOf(document.getElementById("examname"));
    res.flagRect = flag ? [Math.round(flag.getBoundingClientRect().width), Math.round(flag.getBoundingClientRect().height)] : null;
    res.flagRects = flag ? flag.querySelectorAll("rect").length : 0;
    res.flagTopbar = !!flag && !!flag.closest("#topbar");

    res.ok = res.opts === 4 && res.nextEnabled && res.examCells === 40 && res.answered === 1
      && res.saved && res.dialog && res.trap && res.closed && res.resume
      && res.logoHref === "/" && res.sideCells === 40 && res.panelRole === "dialog/true/Feuille de réponses"
      && res.sideFinish === 1 && res.panelFinish === 1 && res.finishPlain
      && res.shortcutAfterDialog && res.reopen && res.sheetOpen && res.sheetClosedByEsc && res.sheetClosedByScrim
      && res.navByCell && res.navBySide && res.endPanel && res.endStay && res.endSide && res.finishWorks
      && res.staysOpenOnAnswer && res.staysOpenAfterDelay && res.hiddenAfterClose && res.reopenAfterRemove && res.toggleCloses
      && res.flagTopbar && res.flagOrder === "0,1,2" && res.flagRects === 3 && res.flagRect[0] === 20 && res.flagRect[1] === 13;
  } catch (e) { res.error = String(e); res.ok = false; }
  // liste des critères évalués : permet de voir lequel a fait échouer res.ok
  res.fails = ["opts", "nextEnabled", "examCells", "answered", "saved", "dialog", "trap", "closed", "shortcutAfterDialog",
    "resume", "resumeKept", "savedAnswers", "logoHref", "sideCells", "panelRole", "sideFinish", "panelFinish", "finishPlain", "reopen",
    "sheetOpen", "sheetClosedByEsc", "sheetClosedByScrim", "navByCell", "navBySide", "endPanel", "endStay", "endSide",
    "finishWorks", "staysOpenOnAnswer", "staysOpenAfterDelay", "hiddenAfterClose", "reopenAfterRemove", "toggleCloses",
    "flagTopbar", "flagOrder", "flagRects", "flagRect"].filter(k => !res[k] || (k === "flagOrder" && res[k] !== "0,1,2"));
  document.title = "SELFTEST " + JSON.stringify(res);
  document.body.insertAdjacentHTML("beforeend", '<pre id="selftest">' + JSON.stringify(res, null, 1) + "</pre>");
})();
</script>
